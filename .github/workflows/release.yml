name: Android CI/CD

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build with Gradle
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK for Upload
        run: |
          mkdir -p release_assets
          cp app/build/outputs/apk/debug/*.apk release_assets/NariShaktiSOS.apk

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/NariShaktiSOS.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
