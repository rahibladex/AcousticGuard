<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A828FF" />
      <stop offset="50%" stop-color="#8C00E3" />
      <stop offset="100%" stop-color="#5B0096" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF3B30" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8C00E3" stop-opacity="0"/>
    </linearGradient>
    <filter id="purpleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Glow Circle -->
  <circle cx="100" cy="100" r="88" fill="#1A1B26" stroke="url(#shieldGrad)" stroke-width="3" filter="url(#purpleGlow)"/>

  <!-- Shield Base -->
  <path d="M100 28 L155 52 C155 110, 100 162, 100 162 C100 162, 45 110, 45 52 Z" 
        fill="url(#shieldGrad)" />

  <!-- Shield Inner Border Accent -->
  <path d="M100 36 L147 57 C147 105, 100 150, 100 150 C100 150, 53 105, 53 57 Z" 
        fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2" />

  <!-- Acoustic Waves in Center -->
  <!-- Center Bar -->
  <rect x="96" y="70" width="8" height="48" rx="4" fill="#FFFFFF" />
  
  <!-- Left Bars -->
  <rect x="84" y="80" width="6" height="28" rx="3" fill="#FFFFFF" fill-opacity="0.9"/>
  <rect x="73" y="88" width="5" height="14" rx="2.5" fill="#FFFFFF" fill-opacity="0.75"/>
  <rect x="63" y="93" width="4" height="6" rx="2" fill="#FFFFFF" fill-opacity="0.5"/>

  <!-- Right Bars -->
  <rect x="110" y="80" width="6" height="28" rx="3" fill="#FFFFFF" fill-opacity="0.9"/>
  <rect x="122" y="88" width="5" height="14" rx="2.5" fill="#FFFFFF" fill-opacity="0.75"/>
  <rect x="133" y="93" width="4" height="6" rx="2" fill="#FFFFFF" fill-opacity="0.5"/>

  <!-- SOS Pulse Indicator Dot -->
  <circle cx="100" cy="130" r="4" fill="#FF3B30" />
  <circle cx="100" cy="130" r="7" fill="none" stroke="#FF3B30" stroke-width="1.5" opacity="0.6">
    <animate attributeName="r" values="4;10" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0" dur="1.5s" repeatCount="indefinite"/>
  </circle>
</svg>
